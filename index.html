<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>IsoWalk Survival</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/style.css?v=6" />
</head>
<body>
  <div id="hud">
    <div class="stats-panel">
      <div class="bar-row">
        <div class="bar-label"><span>HEALTH</span><span id="hp-val">100%</span></div>
        <div class="bar-track"><div id="hp-fill" class="bar-fill"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>STAMINA</span><span id="stam-val">100%</span></div>
        <div class="bar-track"><div id="stam-fill" class="bar-fill"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>FULLNESS</span><span id="food-val">85%</span></div>
        <div class="bar-track"><div id="food-fill" class="bar-fill"></div></div>
      </div>
    </div>

    <div id="mission-box" class="mission-panel">
      <div class="mission-title">📡 EVAC RADIO: <span id="mission-pct">0/4 PARTS</span></div>
      <div id="mission-sub" class="mission-sub">Find 4 radio parts across town & repair the SE Tower</div>
      <div class="bar-track" style="margin-top:5px;"><div id="mission-fill" class="bar-fill"></div></div>
    </div>

    <div class="top-right">
      <div class="pill" id="coords">Fists • 6.5, 6.5</div>
      <button id="bag-toggle">🎒 BAG (<span id="bag-count">0/8</span>)</button>
    </div>
  </div>

  <div id="toast">Picked up item</div>

  <div id="bag-drawer">
    <div class="bag-header">
      <span>BACKPACK</span>
      <span id="bag-slots-label" style="color:#94a3b8;">0 / 8 Slots</span>
    </div>
    <div id="bag-list"></div>
  </div>

  <div id="actions">
    <div id="repair-btn" class="action-btn">REPAIR<br/>TOWER</div>
    <div id="grab-btn" class="action-btn">GRAB</div>
    <div id="sprint-btn" class="action-btn">SPRINT</div>
  </div>

  <div id="gameover">
    <h1>YOU DIED</h1>
    <p>Keep your fullness up and clear zombies around buildings.</p>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <canvas id="game"></canvas>

  <script>
    window.addEventListener('error', (e) => {
      document.body.insertAdjacentHTML(
        'beforeend',
        `<div style="position:fixed;bottom:10px;left:10px;right:10px;background:#7f1d1d;color:#fecaca;padding:10px;border-radius:8px;font-size:12px;z-index:99;">JS Error: ${e.message} (${e.filename}:${e.lineno})</div>`
      );
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <script type="module" src="./js/main.js?v=7"></script>
</body>
</html>
